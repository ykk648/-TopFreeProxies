name: sub_merge

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sub-merge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: utils/requirements.txt

      - name: Install dependencies
        run: pip install -r utils/requirements.txt

      - name: Check enabled sources
        run: python utils/source_health.py

      - name: Start subconverter
        run: |
          curl --fail --location --retry 3 \
            --output subconverter.tar.gz \
            https://github.com/tindy2013/subconverter/releases/download/v0.9.0/subconverter_linux64.tar.gz
          echo "884a6d1168267eba076fcdd5171215bacf98c17948ab526e4cbbdcad5f7a0217  subconverter.tar.gz" | sha256sum --check
          tar -xzf subconverter.tar.gz
          chmod +x subconverter/subconverter
          nohup ./subconverter/subconverter >subconverter.log 2>&1 &
          sleep 2

      - name: Merge subscriptions
        run: python utils/list_merge.py

      - name: Commit generated files
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add README.md sub/source_health.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "$(date '+%Y-%m-%d %H:%M:%S') merge nodes"
          git push origin HEAD:master
